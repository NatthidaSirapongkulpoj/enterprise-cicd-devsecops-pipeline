name: CI Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint code (flake8)
        run: python -m flake8 app

      - name: Run tests
        run: PYTHONPATH=. pytest -v tests


  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enterprise-cicd-app -f docker/Dockerfile .

      - name: Run container (smoke test)
        run: |
          docker run -d -p 5000:5000 --name app enterprise-cicd-app
          sleep 5
          curl http://localhost:5000/health
          docker stop app
