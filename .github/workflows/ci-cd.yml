name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging

  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "277731793168"
  ECR_REPOSITORY: enterprise-cicd-app

###############################################################################
# Code Quality
###############################################################################

jobs:

  code-quality:

    name: Code Quality & Testing

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install \
            pytest \
            flake8 \
            bandit

      - name: Flake8
        run: |
          python -m flake8 app

      - name: Run Pytest
        run: |
          PYTHONPATH=. pytest -v tests

      - name: Run Bandit
        continue-on-error: true
        run: |

          mkdir -p security

          bandit \
            -r app \
            -c security/bandit.yaml \
            -f txt \
            -o security/bandit-report.txt || true

          echo ""
          echo "========== BANDIT REPORT =========="
          cat security/bandit-report.txt || true
          echo "==================================="

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: security/bandit-report.txt

###############################################################################
# Terraform
###############################################################################

  terraform:

    name: Terraform Validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

###############################################################################
# Checkov
###############################################################################

  checkov:

    name: Checkov IaC Scan

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true

###############################################################################
# Docker Build
###############################################################################

  docker:

    name: Docker Build

    needs:
      - code-quality
      - terraform
      - checkov

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $ECR_REPOSITORY:latest .

###############################################################################
# Trivy
###############################################################################

  trivy:

    name: Trivy Container Scan

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $ECR_REPOSITORY:latest .

      - name: Run Trivy Scan

        run: |

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/.trivyignore:/.trivyignore \
            aquasec/trivy:latest image \
            --ignorefile /.trivyignore \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            $ECR_REPOSITORY:latest

###############################################################################
# Push Image
###############################################################################

  push-image:

    name: Push Docker Image to Amazon ECR

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs:
      - trivy

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Credentials

        run: |

          echo "AWS Region : $AWS_REGION"
          echo "AWS Account: $AWS_ACCOUNT_ID"

          aws sts get-caller-identity

      - name: Login to Amazon ECR

        run: |

          aws ecr get-login-password \
            --region $AWS_REGION \
            | docker login \
            --username AWS \
            --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker Image

        run: |

          docker build \
            -f docker/Dockerfile \
            -t $ECR_REPOSITORY:latest .

      - name: Tag Docker Image

        run: |

          docker tag \
            $ECR_REPOSITORY:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Push Docker Image

        run: |

          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest
