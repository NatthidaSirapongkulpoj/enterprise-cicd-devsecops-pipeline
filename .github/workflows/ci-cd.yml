name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging

  pull_request:
    branches:
      - main
      - staging

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: enterprise-cicd-app

permissions:
  contents: read
  security-events: write

jobs:

  code-quality:

    name: Code Quality & Testing
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 bandit

      - name: Flake8 Lint
        run: |
          python -m flake8 app

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. pytest -v tests

      - name: Bandit Security Scan
        run: |
          mkdir -p security
          bandit -r app \
            -c security/bandit.yaml \
            -f txt \
            -o security/bandit-report.txt

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: security/bandit-report.txt


  terraform-validation:

    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend=false

      - run: terraform fmt -check

      - run: terraform validate


  checkov:

    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true


  docker-build:

    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - code-quality
      - terraform-validation
      - checkov

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $ECR_REPOSITORY:latest .


  trivy:

    name: Trivy Container Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:

      - uses: actions/checkout@v4

      - name: Build Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $ECR_REPOSITORY:latest .

      - name: Run Trivy Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/root/.cache/ \
            aquasec/trivy:latest \
            image \
            --ignorefile /.trivyignore \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            $ECR_REPOSITORY:latest


  push-ecr:

    name: Push Docker Image to Amazon ECR

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - trivy

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
          --region $AWS_REGION | \
          docker login \
          --username AWS \
          --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $ECR_REPOSITORY:latest .

      - name: Tag Docker Image
        run: |
          docker tag \
          $ECR_REPOSITORY:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest
