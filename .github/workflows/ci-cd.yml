name: Multi-Environment CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: PYTHONPATH=. pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t flask-app:${{ github.ref_name }} -f docker/Dockerfile .

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DEV (simulated)
        run: echo "Deploying to DEV environment"

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to STAGING (simulated)
        run: echo "Deploying to STAGING environment"

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Production approval gate
        run: echo "Manual approval recommended for PROD"

      - name: Deploy to PROD (simulated)
        run: echo "Deploying to PRODUCTION environment"
        